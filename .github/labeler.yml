# 按仓库真实路径分配区域标签；标签由维护者统一建立。
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["*.md", "docs/**", "changelog/**"]
"area: tests":
  - changed-files:
      - any-glob-to-any-file: ["**/*_test.go", "onebottest/**", "integration/**"]
"area: github-actions":
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
"area: onebot11":
  - changed-files:
      - any-glob-to-any-file: ["onebot11.go", "internal/**", "client/**", "event/**", "segment/**", "perm/**", "cmd/**", "adapter_config_schema.json", "plugin.yaml", "i18n/**", "go.mod", "go.sum"]
